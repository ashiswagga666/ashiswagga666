name: Generate Pac-Man Game

on:
  schedule: # Jalankan otomatis setiap 24 jam
    - cron: "0 */24 * * *"
  workflow_dispatch: # Izinkan untuk dijalankan manual
  push: # Jalankan setiap ada push ke branch main
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Push file SVG yang sudah dibuat ke branch 'output'
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
